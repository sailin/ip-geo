# nginx site for ip-geo. Copy to /etc/nginx/sites-available/ip-geo,
# set server_name, then run `certbot --nginx` to add HTTPS.

upstream ip_geo {
    server 127.0.0.1:3000;
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;
    server_name geo.example.com;

    location / {
        proxy_pass http://ip_geo;
        proxy_http_version 1.1;
        proxy_set_header Connection "";

        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Overwrite, don't append: the app trusts X-Forwarded-For, so any
        # value the client sent must be discarded or they could fake their IP.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
